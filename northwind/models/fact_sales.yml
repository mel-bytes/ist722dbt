version: 2

models:
  - name: fact_sales
    description: Sales fact table. Transaction grain type. One row per order per product.
    columns:
      - name: orderid
        description: Degenerate dimension, source key of the order
        tests:
          - not_null
      - name: customerkey
        description: Dimension key for dim_customer
      - name: employeekey
        description: Dimension key for dim_employee
      - name: orderdatekey
        description: role play Order Date Dimension key for dim_date
      - name: productkey
        description: Dimension key for dim_product
      - name: quantity
        description: the quantity of the product on the order
        tests:
          - not_null
      - name: extendedpriceamount
        description: quantity * product price
        tests:
          - not_null
      - name: discountamount
        description: price * discount
        tests:
          - not_null
      - name: soldamount
        description: extendedpriceamount - discountamount
        tests:
          - not_null